[project]
name = "stepper"
version = "0.1.0"
description = "HackerFab photolithography stepper control"
readme = "README.md"
# Pillow 11.1 (locked below) ships native wheels through Python 3.13.  Keeping
# Python below 3.14 prevents uv from falling back to a platform-specific Pillow
# source build on a fresh macOS or Windows installation.
requires-python = ">=3.10,<3.14"
dependencies = [
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyserial>=3.5",
    "toml>=0.10",
    "ttkbootstrap>=1.10",
]

[project.optional-dependencies]
# Only needed to retrain or re-export the alignment model: uv sync --extra training
training = ["ultralytics>=8.3", "onnx>=1.12", "onnxslim>=0.1.71"]
# Install with: uv sync --extra basler
basler = ["pypylon>=4.1"]

[tool.uv]
# This project is run as a script, not installed as a package.
package = false
