# This section configures the camera used for the GUI's preview.
[camera]
# Available options are:
# "webcam" (for a generic USB camera),
# "basler" (for a Basler/Pylon camera)
# "flir" (for a FLIR camera)
# "none" (to disable camera)
type = "webcam"
# The index field is optional and is only used to select which of multiple webcams or basler/pylon cameras should be used,
# e.g. on a laptop where there may be a builtin webcam in addition to an external USB camera.
device = "auto"
# Capture API. "auto" = Media Foundation on Windows, V4L2 on Linux, AVFoundation on macOS.
# Other choices: "msmf", "dshow", "v4l2", "any". Note: with "dshow" the Arducam B0477 shows a solid white image.
backend = "auto"
# Camera exposure in DirectShow units (log2 of seconds): -11 = 0.5 ms, -6 = 16 ms, -5 = 31 ms, -4 = 62 ms.
# "auto" leaves the camera's own setting alone. Long exposures (-5 or -4) remove the coloured bands
# caused by the DLP projector's colour flashes. Setting a number makes "auto" backend use DirectShow.
exposure = "auto"
# Auto validates decoded frames and favors moderate-bandwidth MJPEG modes.
mode = "auto"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
reject-green = true
# The output from the camera is typically too large to show at full resolution.
# This parameter adjusts the size of the camera feed before it is displayed in the GUI.
gui-scale = 0.25
# The following two values adjust the *camera* exposure in microseconds when viewing red or UV light.
# Note that using values that are not a multiple of 4167 can lead to flickering.
red-exposure = 4167.0
uv-exposure = 25000.0

# This section configures the motion stage
[stage]
# Set enabled to false to disable all motion.
enabled = true
# Set homing to false if your stage does not have limit sensors
homing = false
# Serial port for the GRBL board.
# "auto" scans for a connected Arduino/GRBL board automatically (recommended).
# Set to a specific path (e.g. "/dev/ttyACM0" or "COM3") to override auto-detection.
port = "auto"

# GRBL's baud rate is almost always 115200, do not change this value
baud-rate = 115200
# Reverse the Z axis so that +Z in the app brings the camera and chip closer together.
invert-z = true
# Optional travel limits in micrometers, as [lowest, highest]. Moves outside them are refused.
# Measure your stage's real range before turning these on. Example for a homed 15 mm stage:
# x-limits = [-15000, 0]
# y-limits = [-15000, 0]
# z-limits = [-15000, 0]

# This section configures alignment marker detection

[alignment]
# Enable or disable real-time detection of alignment markers
enabled = true
# Alignment-marker model. best.onnx runs without PyTorch (also in the standalone app);
# best.pt needs the ultralytics package. A .pt path also uses a .onnx file next to it.
model_path = "ckpts/best.onnx"
# Camera resolution the marker coordinates below were measured at. They are scaled to
# whatever resolution the camera actually runs at.
reference-width = 1920
reference-height = 1080
# Alignment marker reference coordinates (in pixels)
right_marker_x = 1820.0  # x-coordinate for markers on the right side
top_marker_y = 269.0     # y-coordinate for markers on the top
bottom_marker_y = 1075.0 # y-coordinate for markers on the bottom
left_marker_x = 280.0    # x-coordinate for markers on the left side
# Scaling factors for converting normalized differences to stage movements (in µm)
x_scale_factor = -1100   # Scaling factor for x-axis movements
y_scale_factor = 800     # Scaling factor for y-axis movements

[ui]
theme = "studio-dark"

[projector]
# Dedicated projector window. "auto" opens it at launch on the first display that is not
# your main screen (Windows must be set to Extend with Win+P, not Duplicate).
# "off" never opens it; exposures then fill the main window instead.
window = "auto"
# Which display to use: "auto", or a display number such as 2 (saved when you pick one
# under Projector window and then click Save settings).
display = "auto"
# Brightness of the red focus image, in percent (2-100). Lower it if a long camera exposure washes out.
red-brightness = 100
