name: Build Windows exe

on:
  push:
    branches: [main, UI+Packaging]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build HackerfabStepper.exe
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: stepper

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test the exe
        run: ./packaging/build_exe.ps1

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: HackerfabStepper-windows
          path: stepper/dist/HackerfabStepper.exe
          if-no-files-found: error
