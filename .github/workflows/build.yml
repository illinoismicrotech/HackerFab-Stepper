# Builds the standalone HackerFab Stepper app for Windows, macOS and Linux.
#
#   Every push / pull request   tests, then builds all platforms. The files are under
#                               "Artifacts" on the workflow run's page (needs a GitHub login).
#   Push to main                also refreshes the "Latest build" pre-release on the
#                               Releases page: one plain download per OS, no login needed.
#   Push a tag like v1.2.0      publishes a normal release with the same downloads:
#                                 git tag v1.2.0 && git push origin v1.2.0
name: Build app

on:
  push:
    branches: [main, 'UI\+Packaging']  # '+' is a pattern symbol in branch filters, so it must be escaped
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: stepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --prefer-binary -r packaging/requirements-build.txt
      - name: Run the test suite (GUI tests use a virtual screen)
        run: PYTHONPATH=src xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -s tests -v

  build:
    name: Build for ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows }
          - { os: macos-latest, label: macOS (Apple silicon) }
          - { os: macos-15-intel, label: macOS (Intel) }
          - { os: ubuntu-22.04, label: Linux }   # older Ubuntu so the program runs on most distributions
    defaults:
      run:
        shell: bash
        working-directory: stepper
    env:
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --prefer-binary -r packaging/requirements-build.txt
      - name: Build, smoke-test and package
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a python packaging/build.py
          else
            python packaging/build.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HackerfabStepper-${{ runner.os }}-${{ runner.arch }}
          path: stepper/dist/release/*
          if-no-files-found: error

  release:
    name: Publish downloads
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" downloads/* --title "HackerFab Stepper $GITHUB_REF_NAME" --generate-notes
      - name: Refresh the "Latest build" pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest downloads/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Built automatically from the newest commit on main ($GITHUB_SHA). Download the file for your computer: Windows .exe, macOS .zip (Apple silicon = M1/M2/M3/M4, Intel = older Macs), or Linux .tar.gz. See the README for first-run steps."
